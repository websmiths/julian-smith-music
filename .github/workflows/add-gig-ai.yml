name: Add gig (AI)

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Describe the gig — e.g. "Stagger Juice at the Workers Club, Lismore, Sunday 21 June at 3pm. Tickets at moshtix.com.au."'
        required: true
        type: string

jobs:
  add-gig:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Create gig file
        env:
          DESCRIPTION:       ${{ inputs.description }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/add-gig-ai.mjs

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/gigs/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add gig: $(cat /tmp/gig-title.txt)"
          git push
