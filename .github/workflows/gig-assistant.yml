name: Gig Assistant (AI)

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'What to do — e.g. "Stagger Juice at the Workers Club Sunday 15 June at 3pm" or "Delete the May 17 gig" or "Add Facebook link https://... to the Afro Grooves gig"'
        required: true
        type: string

jobs:
  gig-assistant:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run gig assistant
        env:
          INSTRUCTION:       ${{ inputs.instruction }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/gig-assistant.mjs

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/gigs/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "$(cat /tmp/gig-summary.txt)"
          git push
