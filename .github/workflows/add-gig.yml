name: Add gig

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Event title (e.g. "Stagger Juice at Lefty''s")'
        required: true
        type: string
      date:
        description: 'Date — e.g. 15 May 2026  or  2026-05-15  or  15/05/2026'
        required: true
        type: string
      bands:
        description: 'Band(s) — comma-separated, e.g. "Stagger Juice" or "Stagger Juice, The Magnificence"'
        required: true
        type: string
      venue:
        description: 'Venue name'
        required: true
        type: string
      time:
        description: 'Start time, e.g. 7:30pm (optional)'
        required: false
        type: string
      city:
        description: 'City / region, e.g. Brisbane QLD (optional)'
        required: false
        type: string
      facebook_event_url:
        description: 'Facebook event URL — stored as a link on the gig page (optional)'
        required: false
        type: string
      ticket_url:
        description: 'Ticket link (optional)'
        required: false
        type: string
      notes:
        description: 'Extra notes, e.g. "With support from…" (optional)'
        required: false
        type: string

jobs:
  add-gig:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Create gig file
        env:
          TITLE:      ${{ inputs.title }}
          DATE:       ${{ inputs.date }}
          BANDS:      ${{ inputs.bands }}
          VENUE:      ${{ inputs.venue }}
          TIME:       ${{ inputs.time }}
          CITY:       ${{ inputs.city }}
          FB_URL:     ${{ inputs.facebook_event_url }}
          TICKET_URL: ${{ inputs.ticket_url }}
          NOTES:      ${{ inputs.notes }}
        run: node .github/scripts/add-gig.mjs

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/gigs/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add gig: $(cat /tmp/gig-title.txt)"
          git push

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
